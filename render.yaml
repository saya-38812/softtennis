services:
  - type: web
    name: softtennis-backend
    env: python
    rootDir: backend
    buildCommand: apt-get update -y && apt-get install -y libgles2 libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
